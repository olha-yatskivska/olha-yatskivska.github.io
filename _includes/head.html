<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.task-list-item-checkbox').forEach(function(cb) {
    cb.disabled = false;
    // Optional: persist state in localStorage
    const key = 'cb_' + window.location.pathname + '_' + cb.parentElement.textContent.trim().slice(0, 50);
    if (localStorage.getItem(key) === 'true') cb.checked = true;
    cb.addEventListener('change', function() {
      localStorage.setItem(key, cb.checked);
    });
  });
});
</script>
